# A LINE bridge for a Matrix homeserver: https://github.com/beeper/line.
# Run ./setup.sh first (README.md). The image is the upstream commit
# BEEPER_LINE_REF, pulled from BEEPER_LINE_IMAGE or built here from source.
services:
  beeper-line:
    build: https://github.com/beeper/line.git#${BEEPER_LINE_REF:?set BEEPER_LINE_REF in .env}
    image: ${BEEPER_LINE_IMAGE:-ghcr.io/genji1024/beeper-line}:${BEEPER_LINE_REF}
    restart: unless-stopped
    environment:
      # The image's entrypoint runs the bridge as this user and gives it
      # data/; setup.sh picks values that keep data/ yours.
      UID: ${BRIDGE_UID:-1337}
      GID: ${BRIDGE_GID:-1337}
    volumes:
      - ./data:/data
    networks:
      - homeserver

networks:
  homeserver:
    external: true
    name: ${HOMESERVER_NETWORK:?set HOMESERVER_NETWORK in .env}
