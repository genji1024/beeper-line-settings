# Build the bridge image for the upstream commit in .env.example and push it
# to ghcr.io/<owner>/beeper-line:<commit>, which setup.sh pulls. The build
# needs more memory than a small server has (README.md); GitHub's runners
# have enough. Forgejo mirrors this repository to GitHub.
name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    # Forgejo also runs .github/workflows when a repository has no
    # .forgejo/workflows; leave the build to GitHub.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: image
        run: |
          ref=$(sed -n 's/^BEEPER_LINE_REF=//p' .env.example)
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "name=ghcr.io/$owner/beeper-line:$ref" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # One image per upstream commit: build it only once, unless asked to.
      - id: exists
        if: github.event_name != 'workflow_dispatch'
        run: |
          if docker manifest inspect "${{ steps.image.outputs.name }}" >/dev/null 2>&1; then
            echo "yes=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.image.outputs.name }} exists; nothing to build"
          fi

      - if: steps.exists.outputs.yes != 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.exists.outputs.yes != 'true'
        uses: docker/build-push-action@v6
        with:
          context: https://github.com/beeper/line.git#${{ steps.image.outputs.ref }}
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.ref }}
            org.opencontainers.image.description=beeper/line ${{ steps.image.outputs.ref }}, built by ${{ github.repository }}
